services:
  # 1. The SMS Web Frontend/Backend (Using Express & Socket.io)
  - type: web
    name: sms-web-app
    runtime: node
    repoPath: sms-web 
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        generateValue: true

  # 2. The Discord Bot Component
  - type: worker
    name: discord-bot-service
    runtime: node
    repoPath: discord-bot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: discord-bot-db
      mountPath: /data
      sizeGB: 1

  # 3. The Standalone API Service
  - type: web
    name: main-api-service
    runtime: node
    repoPath: api-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: api-service-db
      mountPath: /data
      sizeGB: 1
