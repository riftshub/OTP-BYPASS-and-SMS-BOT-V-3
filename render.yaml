services:
  - type: web
    name: sms-web-app
    runtime: node
    rootDir: sms
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false

  - type: worker
    name: discord-bot-service
    runtime: node
    plan: starter
    rootDir: bots/discord
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: discord-bot-db
      mountPath: /data
      sizeGB: 1

  - type: web
    name: main-api-service
    runtime: node
    plan: starter
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: api-service-db
      mountPath: /data
      sizeGB: 1
